<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD3E8"/>
      <stop offset="1" stop-color="#63C5DE"/>
    </linearGradient>
    <radialGradient id="head" cx="0.5" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#F2FBFD"/>
      <stop offset="1" stop-color="#DFF3FA"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF8FD"/>
      <stop offset="1" stop-color="#BFE9F5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- 头顶留白：证件照头部居中偏上 -->
  <ellipse cx="300" cy="270" rx="118" ry="140" fill="url(#head)"/>
  <!-- 耳朵 -->
  <ellipse cx="192" cy="285" rx="26" ry="38" fill="#EAF8FD"/>
  <ellipse cx="408" cy="285" rx="26" ry="38" fill="#EAF8FD"/>
  <!-- 脖颈 + 肩部 -->
  <rect x="272" y="380" width="56" height="90" rx="24" fill="#EAF8FD"/>
  <path d="M120 800 C 130 620, 210 520, 300 520 C 390 520, 470 620, 480 800 Z" fill="url(#shirt)"/>
  <!-- 细部：淡色领口线 -->
  <path d="M236 600 Q 300 560 364 600" fill="none" stroke="#9FDFEF" stroke-width="6" stroke-linecap="round"/>
  <!-- 底部标注 -->
  <rect x="190" y="700" width="220" height="52" rx="26" fill="rgba(255,255,255,0.28)"/>
  <text x="300" y="733" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#0F6E8C" text-anchor="middle" font-weight="600">证件照 · 待替换</text>
</svg>
